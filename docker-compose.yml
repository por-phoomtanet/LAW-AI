services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # bind เฉพาะ 127.0.0.1 — ไม่ expose Postgres ออกอินเทอร์เน็ตสาธารณะ (เจอ credential-stuffing
      # bot สแกนหา default user เช่น postgres/strapi/pgg_superadmins จริงจาก log จนต้องแก้ด่วน)
      # api ต่อผ่าน docker network internal (hostname "postgres") อยู่แล้ว ไม่ต้องพึ่ง port นี้เลย
      # ต่อจาก host เครื่องเดียวกัน/ผ่าน SSH tunnel ได้เหมือนเดิมถ้าต้อง debug ตรงๆ
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      PORT: ${PORT}
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # NEXT_PUBLIC_* ต้องส่งเป็น build arg — Next.js inline ค่านี้เข้า client JS bundle
      # ตอน build (ไม่ใช่อ่านจาก process.env ตอน container รัน) และ .dockerignore กัน .env
      # ไม่ให้เข้า build context ด้วย ดังนั้น environment/env_file ตอน runtime ไม่มีผลกับตัวนี้เลย
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    restart: unless-stopped
    environment:
      PORT: ${WEB_PORT}
    ports:
      - "${WEB_PORT}:${WEB_PORT}"
    depends_on:
      - api

volumes:
  postgres_data:
