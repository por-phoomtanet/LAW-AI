services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: law_ai
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/law_ai?schema=public
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/law_ai?schema=public
      PORT: "4002"
    ports:
      - "4002:4002"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # NEXT_PUBLIC_* ต้องส่งเป็น build arg — Next.js inline ค่านี้เข้า client JS bundle
      # ตอน build (ไม่ใช่อ่านจาก process.env ตอน container รัน) และ .dockerignore กัน .env
      # ไม่ให้เข้า build context ด้วย ดังนั้น environment/env_file ตอน runtime ไม่มีผลกับตัวนี้เลย
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    restart: unless-stopped
    environment:
      PORT: "3002"
    ports:
      - "3002:3002"
    depends_on:
      - api

volumes:
  postgres_data:
